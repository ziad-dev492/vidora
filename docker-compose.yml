services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vidora
      POSTGRES_USER: vidora
      POSTGRES_PASSWORD: vidora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidora -d vidora"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vidora:vidora@db:5432/vidora
      REDIS_URL: redis://redis:6379/0
      DEBUG: "1"
      SESSION_COOKIE_SECURE: "0"
      CSRF_COOKIE_SECURE: "0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A config worker -l INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vidora:vidora@db:5432/vidora
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  media_data:
