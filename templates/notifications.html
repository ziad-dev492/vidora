{% extends 'base.html' %}
{% block content %}<section class="page-heading"><div><p class="eyebrow">آخر المستجدات</p><h1>الإشعارات</h1></div></section><div class="notification-list">{% for item in notifications %}<form method="post" action="{% url 'notification_read' item.pk %}" class="notification-item {% if not item.is_read %}unread{% endif %}">{% csrf_token %}<button class="notification-content"><span class="notification-icon"><i class="bi bi-bell"></i></span><span><strong>{{ item.message }}</strong><small>{{ item.created_at|date:'Y-m-d H:i' }} · {% if item.is_read %}مقروء{% else %}غير مقروء{% endif %}</small></span><i class="bi bi-chevron-left"></i></button></form>{% empty %}<div class="empty-state"><i class="bi bi-bell-slash"></i><h2>أنت على اطلاع</h2><p>لا توجد إشعارات جديدة.</p></div>{% endfor %}</div>{% endblock %}
